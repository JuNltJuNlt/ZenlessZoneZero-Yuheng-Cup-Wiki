<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝区零 Wiki</title>
    <link rel="preload" as="image" href="image/bg.jpg">
    <link rel="preload" as="image" href="image/menu.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="star-bg"></div>
    <div class="star-top">
        <h1 class="site-title">玉衡杯数据库</h1>
        <p class="site-version">3.1V12</p>
        <div class="menu-container">
            <img src="image/menu.png" alt="菜单" class="menu-icon" id="menuIcon">
            <div class="menu-dialog" id="menuDialog">
                <div class="menu-arrow"></div>
                <div class="menu-title">菜单</div>
                <a href="index.html" class="menu-btn menu-btn-full">返回主页</a>
                <div class="menu-btn-row">
                    <a href="Monster.html" class="menu-btn">怪物</a>
                    <a href="Shiyu Defence.html" class="menu-btn">式舆防卫战</a>
                    <a href="Deadly Assault.html" class="menu-btn">危局强袭战</a>
                </div>
            </div>
        </div>
    </div>
    <div class="white-board">
        <div class="game-tag">绝区零</div>
        <div class="countdown" id="countdown">3.1  --:--:--</div>
        <a href="formulas.html" class="nav-item">公式大全</a>
        <div class="module-nav">
            <a href="Monster.html" class="module-btn">怪物</a>
            <a href="Shiyu Defence.html" class="module-btn module-center">式舆防卫战</a>
            <a href="Deadly Assault.html" class="module-btn">危局强袭战</a>
        </div>
    </div>
    <div class="star-bottom"></div>
    <script>
        (function() {
            var menuIcon = document.getElementById('menuIcon');
            var menuDialog = document.getElementById('menuDialog');
            
            menuIcon.addEventListener('click', function(e) {
                e.stopPropagation();
                if (menuDialog.classList.contains('show')) {
                    menuDialog.classList.remove('show');
                } else {
                    menuDialog.classList.add('show');
                }
            });
            
            document.addEventListener('click', function(e) {
                if (!menuDialog.contains(e.target) && e.target !== menuIcon) {
                    menuDialog.classList.remove('show');
                }
            });
        })();
        
        (function() {
            var countdownEl = document.getElementById('countdown');
            var target = new Date('2026-07-29T06:00:00');
            
            function pad(num, len) {
                var str = '' + num;
                while (str.length < len) {
                    str = '0' + str;
                }
                return str;
            }
            
            function updateCountdown() {
                var now = new Date();
                var diff = target - now;
                
                if (diff <= 0) {
                    countdownEl.textContent = '3.1  00:00:00';
                    return;
                }
                
                var hours = Math.floor(diff / (1000 * 60 * 60));
                var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownEl.textContent = '3.1  ' + pad(hours, 2) + ':' + pad(minutes, 2) + ':' + pad(seconds, 2);
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        })();
    </script>
</body>
</html>
