<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝区零 Wiki</title>
    <link rel="preload" as="image" href="image/bg.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="star-bg"></div>
    <div class="star-top">
        <h1 class="site-title">玉衡杯数据库</h1>
        <p class="site-version">3.1V12</p>
    </div>
    <div class="white-board">
        <div class="game-tag">绝区零</div>
        <div class="countdown" id="countdown">3.1  --:--:--</div>
        <a href="formulas.html" class="nav-item">公式大全</a>
        <div class="module-nav">
            <a href="Monster.html" class="module-btn">怪物</a>
            <a href="Shiyu Defence.html" class="module-btn module-center">式舆防卫战</a>
            <a href="Deadly Assault.html" class="module-btn">危局强袭战</a>
        </div>
    </div>
    <div class="star-bottom"></div>
    <script>
        (function() {
            var countdownEl = document.getElementById('countdown');
            var target = new Date('2026-07-29T06:00:00');
            
            function pad(num, len) {
                var str = '' + num;
                while (str.length < len) {
                    str = '0' + str;
                }
                return str;
            }
            
            function updateCountdown() {
                var now = new Date();
                var diff = target - now;
                
                if (diff <= 0) {
                    countdownEl.textContent = '3.1  00:00:00';
                    return;
                }
                
                var hours = Math.floor(diff / (1000 * 60 * 60));
                var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownEl.textContent = '3.1  ' + pad(hours, 2) + ':' + pad(minutes, 2) + ':' + pad(seconds, 2);
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        })();
    </script>
</body>
</html>
